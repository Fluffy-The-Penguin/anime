<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Stream your anime with episode details and tracking." />
    <title>AniTrack | Player</title>
    <link rel="stylesheet" href="styles.css?v=site-fix-68" />
    <script src="app.js?v=site-fix-68" defer></script>
  </head>
  <body data-page="player">
    <header class="topbar shell anilist-topbar">
      <a class="brand anilist-brand" href="index.html" aria-label="AniTrack home"><span>AT</span><b>AniTrack</b></a>
      <nav class="nav anilist-nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a class="active" href="anime.html">Anime</a>
        <a href="manga.html">Manga / Manhwa</a>
        <a href="doujin.html" data-adult-nav hidden>Doujin</a>
        <a href="profile.html">Profile</a>
        <a href="settings.html">Settings</a>
      </nav>
    </header>

    <main class="shell">
      <div class="player-container">
        <!-- Video Player Section -->
        <section class="player-main">
          <div class="video-wrapper">
            <div class="video-player" data-video-player>
              <div class="player-loading">
                <div class="spinner"></div>
                <p>Loading episode...</p>
              </div>
              <div class="player-settings-panel" data-player-settings-panel hidden>
                <label>Quality <select data-player-quality><option value="">Auto / selected source</option></select></label>
                <label>Speed <select data-player-speed><option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option></select></label>
                <label>Subtitles <select data-player-subtitles><option value="off">Off</option></select></label>
                <label>Audio <select data-player-audio><option value="default">Default audio</option></select></label>
                <div class="player-check-row">
                  <label class="player-check"><input data-player-auto-play type="checkbox"> Auto play</label>
                  <label class="player-check"><input data-player-auto-next type="checkbox"> Auto next</label>
                  <label class="player-check"><input data-player-ambient-toggle type="checkbox"> Ambient mode</label>
                </div>
                <a class="player-settings-link" href="settings.html?section=streaming">Open streaming settings</a>
              </div>
            </div>
            <div class="player-controls" data-player-controls>
              <div class="player-info">
                <h2 data-episode-title>Episode Loading...</h2>
                <p data-episode-number class="muted"></p>
              </div>
              <div class="player-actions">
                <button class="icon-btn subtitle-toggle" data-subtitle-toggle type="button" aria-label="Toggle subtitles" aria-pressed="true" hidden>CC</button>
                <button class="icon-btn" data-player-settings-toggle type="button" aria-label="Player settings" aria-expanded="false">⚙</button>
                <a class="btn secondary player-app-settings" href="settings.html?section=streaming">Settings</a>
                <button class="btn secondary" data-mark-watched type="button">Mark as Watched</button>
                <button class="icon-btn" data-fullscreen-btn type="button" aria-label="Fullscreen">⛶</button>
              </div>
            </div>
            <div class="player-source-bar">
              <label class="detail-source-picker">Source <select data-player-source-select><option>Loading sources...</option></select></label>
              <label>Find source as <input data-player-source-query type="search" placeholder="Custom source title" autocomplete="off"></label>
              <span class="muted" data-player-source-status>Source ready</span>
            </div>
          </div>

          <!-- Episode Info Card -->
          <div class="episode-card panel">
            <div class="episode-meta">
              <span data-episode-release class="muted">Release Date: TBA</span>
              <span data-episode-rating class="muted">Rating: TBA</span>
            </div>
            <div data-episode-description></div>
            <div class="streaming-sources" data-streaming-sources>
              <p class="muted">Loading sources...</p>
            </div>
          </div>
        </section>

        <!-- Sidebar: Episodes List -->
        <aside class="player-sidebar">
          <div class="sidebar-head">
            <h3 data-anime-title>Episodes</h3>
            <div class="sidebar-controls">
              <button class="icon-btn" data-episodes-search-toggle type="button" aria-label="Search episodes">🔍</button>
              <button class="icon-btn" data-sort-episodes type="button" aria-label="Sort episodes">↕</button>
            </div>
          </div>

          <div class="episodes-search" data-episodes-search>
            <input type="search" placeholder="Search episodes..." aria-label="Search episodes">
          </div>

          <div class="episodes-list" data-episodes-list>
            <div class="episodes-loading">
              <div class="spinner"></div>
              <p>Loading episodes...</p>
            </div>
          </div>
        </aside>
      </div>
    </main>

    <style>
      body[data-page="player"] {
        --bg: #05070b;
        --bg-2: #0a101a;
        --panel: rgba(12, 18, 29, 0.82);
        --solid: #101827;
        --soft: rgba(255, 255, 255, 0.1);
        --line: rgba(148, 163, 184, 0.22);
        --text: #f5f8ff;
        --muted: #93a4bb;
        --al-bg: #05070b;
        --al-bg-2: #0a101a;
        --al-surface: #111a29;
        --al-surface-2: #0d1522;
        --al-text: #f5f8ff;
        --al-muted: #93a4bb;
        background:
          radial-gradient(circle at 16% -8%, rgba(72, 219, 251, 0.22), transparent 34%),
          radial-gradient(circle at 82% 4%, rgba(255, 79, 195, 0.16), transparent 28%),
          linear-gradient(145deg, #05070b 0%, #090f19 50%, #05070b 100%) !important;
        color: var(--text);
      }

      :root[data-theme="light"] body[data-page="player"] {
        --bg: #f4f7fb;
        --bg-2: #eaf1f8;
        --panel: rgba(255, 255, 255, 0.92);
        --solid: #ffffff;
        --soft: rgba(49, 76, 112, 0.08);
        --line: rgba(61, 83, 112, 0.18);
        --text: #172234;
        --muted: #63758c;
        --al-bg: #f4f7fb;
        --al-bg-2: #eaf1f8;
        --al-surface: #ffffff;
        --al-surface-2: #f7faff;
        --al-text: #172234;
        --al-muted: #63758c;
        background: linear-gradient(145deg, #eef4ff 0%, #fff6fb 54%, #f8fbff 100%) !important;
        color: var(--text);
      }

      body[data-page="player"] .mobile-bottom-nav,
      body[data-page="player"] .site-footer {
        display: none;
      }

      body[data-page="player"] > .topbar.shell {
        position: static !important;
        display: flex !important;
        width: min(100%, 1920px);
        padding: 10px clamp(10px, 1.2vw, 20px);
        border-bottom: 1px solid rgba(148, 163, 184, 0.13);
        background: rgba(5, 10, 18, 0.94) !important;
      }

      :root[data-theme="light"] body[data-page="player"] > .topbar.shell {
        border-bottom-color: rgba(61, 83, 112, 0.14);
        background: rgba(255, 255, 255, 0.94) !important;
        box-shadow: 0 12px 28px rgba(36, 54, 82, 0.08);
      }

      :root[data-theme="light"] body[data-page="player"] > .topbar.shell .brand,
      :root[data-theme="light"] body[data-page="player"] > .topbar.shell .nav,
      :root[data-theme="light"] body[data-page="player"] > .topbar.shell .icon-btn:not(.profile-btn),
      :root[data-theme="light"] body[data-page="player"] > .topbar.shell .brand span,
      :root[data-theme="light"] body[data-page="player"] > .topbar.shell .brand b,
      :root[data-theme="light"] body[data-page="player"] > .topbar.shell .nav a {
        color: #26364c !important;
      }

      :root[data-theme="light"] body[data-page="player"] > .topbar.shell .nav a:hover,
      :root[data-theme="light"] body[data-page="player"] > .topbar.shell .nav a.active {
        color: #0f2238 !important;
        background: rgba(22, 168, 255, 0.16) !important;
      }

      body[data-page="player"] > .topbar.shell .brand,
      body[data-page="player"] > .topbar.shell .nav,
      body[data-page="player"] > .topbar.shell .icon-btn:not(.profile-btn) {
        color: #dce8f7 !important;
        background: transparent !important;
        box-shadow: none !important;
      }

      body[data-page="player"] > .topbar.shell .brand span,
      body[data-page="player"] > .topbar.shell .brand b,
      body[data-page="player"] > .topbar.shell .nav a {
        color: #dce8f7 !important;
      }

      body[data-page="player"] > .topbar.shell .nav a:hover,
      body[data-page="player"] > .topbar.shell .nav a.active {
        color: #ffffff !important;
        background: rgba(72, 219, 251, 0.12) !important;
      }

      body[data-page="player"] > .topbar.shell .nav {
        position: static !important;
        display: flex !important;
        width: auto !important;
        transform: none !important;
      }

      body[data-page="player"] main.shell {
        width: min(100%, 1920px);
        padding: 0 clamp(10px, 1.2vw, 20px) 24px;
      }

      .player-container {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 400px);
        gap: clamp(14px, 1.8vw, 24px);
        margin: 16px 0 0;
        align-items: start;
      }

      .player-main {
        display: grid;
        gap: 18px;
      }

      .video-wrapper {
        position: relative;
        display: grid;
        gap: 8px;
      }

      .video-player {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 18px;
        background: #000;
        box-shadow: 0 24px 90px rgba(0, 0, 0, 0.46), 0 0 0 1px rgba(255, 255, 255, 0.04);
        overflow: hidden;
        display: grid;
        place-items: center;
      }

      .video-player.ambient-on {
        overflow: visible;
      }

      .player-ambient-backdrop {
        position: absolute;
        inset: calc(var(--ambient-spread, 34px) * -1);
        z-index: 0;
        border-radius: 30px;
        background: center / cover no-repeat;
        filter: blur(var(--ambient-blur, 34px)) saturate(var(--ambient-saturation, 1.35)) brightness(var(--ambient-brightness, 0.82));
        opacity: var(--ambient-opacity, 0.58);
        transform: scale(var(--ambient-scale, 1.03));
        pointer-events: none;
      }

      .player-ambient-backdrop[hidden] {
        display: none;
      }

      .video-player > video {
        position: relative;
        z-index: 1;
        display: block;
        border-radius: inherit;
        overflow: hidden;
      }

      .player-loading {
        display: grid;
        gap: 16px;
        place-items: center;
        color: var(--muted);
      }

      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(72, 219, 251, 0.2);
        border-top-color: var(--blue);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .video-player video {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .video-player video::-webkit-media-controls-fullscreen-button {
        display: none;
      }

      .player-buffering {
        position: absolute;
        inset: 0;
        z-index: 6;
        display: grid;
        gap: 10px;
        place-items: center;
        align-content: center;
        color: rgba(255, 255, 255, 0.88);
        background: radial-gradient(circle at center, rgba(0, 0, 0, 0.34), rgba(0, 0, 0, 0.08) 42%, transparent 70%);
        opacity: 0;
        pointer-events: none;
        transition: opacity 140ms ease;
      }

      .player-buffering .spinner {
        width: 34px;
        height: 34px;
        border-width: 3px;
      }

      .player-buffering span {
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        padding: 6px 10px;
        background: rgba(8, 12, 18, 0.72);
        font-size: 12px;
        font-weight: 800;
      }

      .video-player.is-buffering .player-buffering {
        opacity: 1;
      }

      .video-center-toggle {
        position: absolute;
        inset: 50% auto auto 50%;
        z-index: 7;
        width: 58px;
        height: 58px;
        transform: translate(-50%, -50%);
        border: 1px solid rgba(255, 255, 255, 0.32);
        border-radius: 50%;
        background: rgba(8, 12, 18, 0.62);
        color: #fff;
        font-size: 25px;
        font-weight: 950;
        line-height: 1;
        cursor: pointer;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.42);
        backdrop-filter: blur(14px) saturate(140%);
        transition: opacity 160ms ease, transform 160ms ease, background 160ms ease;
      }

      .video-center-toggle:hover,
      .video-center-toggle:focus-visible {
        background: rgba(15, 23, 42, 0.86);
        transform: translate(-50%, -50%) scale(1.04);
        outline: none;
      }

      .video-controls-idle .video-center-toggle {
        opacity: 0;
        pointer-events: none;
      }

      .video-center-skip {
        position: absolute;
        top: 50%;
        z-index: 7;
        width: 48px;
        height: 48px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 14px;
        background: rgba(8, 12, 18, 0.48);
        color: #fff;
        font-size: 13px;
        font-weight: 950;
        cursor: pointer;
        transform: translateY(-50%);
        backdrop-filter: blur(12px) saturate(130%);
        transition: opacity 160ms ease, background 160ms ease, transform 160ms ease;
      }

      .video-center-skip:hover,
      .video-center-skip:focus-visible {
        background: rgba(15, 23, 42, 0.82);
        outline: none;
      }

      .video-center-skip-back {
        left: calc(50% - 124px);
      }

      .video-center-skip-forward {
        left: calc(50% + 76px);
      }

      .video-controls-idle .video-center-skip {
        opacity: 0;
        pointer-events: none;
      }

      .custom-video-controls {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 8;
        display: grid;
        grid-template-columns: auto auto auto minmax(90px, 1fr) auto auto auto;
        grid-template-areas:
          "play volume time progress captions settings fullscreen";
        align-items: center;
        gap: 3px 7px;
        padding: 5px 10px 5px;
        border: 0;
        border-radius: 0;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.72), rgba(0, 0, 0, 0.24) 70%, transparent);
        backdrop-filter: none;
        transition: opacity 160ms ease, transform 160ms ease;
      }

      .custom-video-controls [data-video-play] { grid-area: play; }
      .custom-video-controls .video-volume-control { grid-area: volume; }
      .custom-video-controls .video-time { grid-area: time; }
      .custom-video-controls .video-progress { grid-area: progress; }
      .custom-video-controls [data-video-captions] { grid-area: captions; }
      .custom-video-controls [data-video-settings] { grid-area: settings; }
      .custom-video-controls [data-video-fullscreen] { grid-area: fullscreen; }

      .video-controls-idle .custom-video-controls {
        opacity: 0;
        pointer-events: none;
        transform: translateY(16px);
      }

      .video-control-btn {
        width: 26px;
        min-height: 26px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #f7f8ff;
        font-weight: 900;
        cursor: pointer;
      }

      .video-control-btn.active {
        background: linear-gradient(135deg, var(--blue), var(--mint));
        color: #06101a;
      }

      .video-control-btn:disabled {
        opacity: 0.42;
        cursor: not-allowed;
      }

      .video-volume-control {
        position: relative;
        display: grid;
        place-items: center;
      }

      .video-volume-control.volume-open .video-control-btn {
        background: rgba(255, 255, 255, 0.18);
      }

      .video-volume-panel {
        position: absolute;
        left: 50%;
        bottom: 36px;
        z-index: 10;
        display: grid;
        place-items: center;
        width: 46px;
        height: 138px;
        padding: 12px 8px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 14px;
        background: rgba(8, 12, 18, 0.92);
        box-shadow: 0 14px 44px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(18px) saturate(130%);
        transform: translateX(-50%);
      }

      .video-volume-panel[hidden] {
        display: none !important;
        pointer-events: none !important;
      }

      .video-time {
        color: rgba(255, 255, 255, 0.82);
        font-size: 11px;
        line-height: 1;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .video-time-range {
        min-width: 86px;
      }

      .video-progress {
        width: 100%;
        min-width: 0;
        height: 3px;
        accent-color: var(--blue);
      }

      .video-volume {
        width: 28px;
        height: 112px;
        accent-color: var(--blue);
        direction: rtl;
        writing-mode: vertical-lr;
      }

      .custom-subtitles {
        position: absolute;
        left: 50%;
        bottom: var(--subtitle-base-offset, 44px);
        z-index: 4;
        max-width: min(78%, 860px);
        padding: 8px 14px 10px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 16px;
        color: rgba(255, 255, 255, 0.96);
        background: rgba(8, 10, 14, 0.62);
        box-shadow: 0 14px 44px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(14px) saturate(130%);
        text-align: center;
        font-size: 28px;
        line-height: 1.18;
        letter-spacing: -0.03em;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.72);
        transform: translate(-50%, 8px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 130ms ease, transform 130ms ease;
      }

      .custom-subtitles.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .video-player:not(.video-controls-idle) .custom-subtitles {
        bottom: var(--subtitle-controls-offset, 66px);
      }

      .video-player.player-settings-open .custom-subtitles {
        bottom: var(--subtitle-settings-offset, var(--subtitle-controls-offset, 66px));
      }

      .custom-subtitles.subtitle-top,
      .video-player:not(.video-controls-idle) .custom-subtitles.subtitle-top,
      .video-player.player-settings-open .custom-subtitles.subtitle-top {
        top: var(--subtitle-base-offset, 58px);
        bottom: auto;
      }

      .player-controls {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        padding: 12px 14px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(16, 24, 39, 0.92), rgba(9, 14, 22, 0.82));
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.22);
        backdrop-filter: blur(14px) saturate(130%);
      }

      :root[data-theme="light"] .player-controls,
      :root[data-theme="light"] .episode-card,
      :root[data-theme="light"] .player-sidebar,
      :root[data-theme="light"] .player-source-bar {
        border-color: rgba(61, 83, 112, 0.16);
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 18px 44px rgba(36, 54, 82, 0.12);
      }

      .video-wrapper:fullscreen,
      .video-wrapper.player-fullscreen {
        width: 100vw;
        height: 100vh;
        background: #000;
        display: block;
        overflow: hidden;
      }

      .video-wrapper:fullscreen .video-player,
      .video-wrapper.player-fullscreen .video-player {
        width: 100%;
        height: 100%;
        aspect-ratio: auto;
        border: 0;
        border-radius: 0;
      }

      .video-wrapper:fullscreen .player-controls,
      .video-wrapper:fullscreen .player-source-bar,
      .video-wrapper.player-fullscreen .player-controls {
        display: none;
      }

      .video-wrapper.player-fullscreen .player-source-bar {
        display: none;
      }

      .video-wrapper:fullscreen .player-settings-panel,
      .video-wrapper.player-fullscreen .player-settings-panel {
        bottom: 46px;
      }

      .video-wrapper:fullscreen .custom-subtitles,
      .video-wrapper.player-fullscreen .custom-subtitles {
        z-index: 7;
        bottom: clamp(68px, 9vh, 110px);
      }

      .video-wrapper:fullscreen .video-player:not(.video-controls-idle) .custom-subtitles,
      .video-wrapper.player-fullscreen .video-player:not(.video-controls-idle) .custom-subtitles {
        bottom: clamp(112px, 15vh, 160px);
      }

      .video-wrapper:fullscreen .video-player.player-settings-open .custom-subtitles,
      .video-wrapper.player-fullscreen .video-player.player-settings-open .custom-subtitles {
        bottom: clamp(112px, 15vh, 160px);
      }

      .video-wrapper:fullscreen .custom-video-controls,
      .video-wrapper.player-fullscreen .custom-video-controls {
        bottom: 0;
      }

      .video-wrapper.player-fullscreen.player-fs-idle .player-settings-panel[hidden] {
        opacity: 0;
        pointer-events: none;
        transform: translateY(18px);
      }

      .player-info h2 {
        margin: 0 0 6px;
        font-size: 15px;
      }

      .player-info p {
        margin: 0;
        font-size: 13px;
      }

      .player-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
      }

      .player-settings-panel {
        position: absolute;
        right: 44px;
        bottom: 42px;
        z-index: 9;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 8px;
        width: min(280px, calc(100% - 28px));
        max-height: min(360px, 52vh);
        overflow: auto;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 14px;
        background: rgba(8, 12, 18, 0.94);
        backdrop-filter: blur(18px) saturate(130%);
        transition: opacity 180ms ease, transform 180ms ease;
      }

      :root[data-theme="light"] .player-settings-panel {
        border-color: rgba(61, 83, 112, 0.18);
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 18px 54px rgba(36, 54, 82, 0.18);
      }

      .player-settings-panel[hidden] {
        display: none !important;
        pointer-events: none !important;
      }

      .player-settings-panel label {
        display: grid;
        gap: 4px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .player-settings-panel select {
        min-height: 32px;
        border-radius: 9px;
        font-size: 12px;
      }

      .player-settings-panel .player-check {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 36px;
        padding: 0;
      }

      .player-settings-panel .player-check-row {
        display: grid;
        gap: 8px;
        padding: 2px 4px 0;
      }

      .player-settings-panel .player-check input {
        width: auto;
        min-height: auto;
      }

      .subtitle-toggle {
        min-width: 48px;
        border-radius: 12px;
        font-size: 12px;
        letter-spacing: 0.04em;
      }

      .subtitle-toggle.active {
        color: #06101a;
        border-color: transparent;
        background: linear-gradient(135deg, var(--blue), var(--mint));
      }

      .episode-card {
        border-radius: 18px;
        padding: 16px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        background: linear-gradient(145deg, rgba(16, 24, 39, 0.88), rgba(10, 15, 24, 0.78));
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.18);
        backdrop-filter: blur(14px) saturate(130%);
      }

      :root[data-theme="light"] [data-episode-description],
      :root[data-theme="light"] .player-info h2,
      :root[data-theme="light"] .sidebar-head h3,
      :root[data-theme="light"] .source-info h4,
      :root[data-theme="light"] .episode-title {
        color: #172234;
      }

      :root[data-theme="light"] .muted,
      :root[data-theme="light"] .player-info p,
      :root[data-theme="light"] .episode-meta span,
      :root[data-theme="light"] .source-section-head span,
      :root[data-theme="light"] .source-info p,
      :root[data-theme="light"] .episode-air-date,
      :root[data-theme="light"] .player-source-bar label,
      :root[data-theme="light"] .player-settings-panel label,
      :root[data-theme="light"] .player-source-bar span,
      :root[data-theme="light"] .player-loading,
      :root[data-theme="light"] .episodes-loading {
        color: #63758c;
      }

      .episode-meta {
        display: flex;
        gap: 16px;
        margin-bottom: 16px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }

      .episode-meta span {
        font-size: 13px;
      }

      [data-episode-description] {
        margin-bottom: 12px;
        line-height: 1.6;
        color: var(--text);
        font-size: 13px;
      }

      .streaming-sources {
        display: grid;
        gap: 10px;
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }

      .scrollable-source-section {
        display: grid;
        gap: 8px;
        margin-bottom: 12px;
      }

      .source-section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .source-section-head h4 {
        margin: 0;
        font-size: 14px;
      }

      .source-section-head span {
        color: var(--muted);
        font-size: 12px;
      }

      .source-scroll-list {
        display: grid;
        gap: 8px;
        max-height: 320px;
        overflow: auto;
        padding-right: 4px;
      }

      .source-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.1);
        transition: all 200ms ease;
      }

      :root[data-theme="light"] .source-item,
      :root[data-theme="light"] .episode-item {
        border-color: rgba(61, 83, 112, 0.14);
        background: rgba(248, 251, 255, 0.88);
      }

      :root[data-theme="light"] .source-item:hover,
      :root[data-theme="light"] .episode-item:hover {
        border-color: rgba(22, 143, 255, 0.28);
        background: rgba(239, 246, 255, 0.96);
      }

      :root[data-theme="light"] .episode-item.active {
        border-color: rgba(22, 143, 255, 0.42);
        background: linear-gradient(135deg, rgba(22, 143, 255, 0.14), rgba(185, 92, 255, 0.1));
      }

      .source-item:hover {
        border-color: color-mix(in srgb, var(--blue) 50%, var(--line));
        background: rgba(255, 255, 255, 0.15);
      }

      .source-info h4 {
        margin: 0 0 4px;
        font-size: 14px;
        color: var(--text);
        font-weight: 700;
      }

      .source-info p {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
      }

      .source-play {
        padding: 6px 12px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--blue), var(--mint));
        color: #06101a;
        border: none;
        font-weight: 700;
        cursor: pointer;
        font-size: 12px;
        white-space: nowrap;
      }

      .player-sidebar {
        display: grid;
        gap: 10px;
        align-content: start;
        max-height: calc(100vh - 28px);
        position: sticky;
        top: 14px;
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 18px;
        padding: 12px;
        background: linear-gradient(145deg, rgba(16, 24, 39, 0.9), rgba(9, 14, 22, 0.8));
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(14px) saturate(130%);
      }

      .sidebar-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 0 2px 4px;
      }

      .sidebar-head h3 {
        margin: 0;
        font-size: 18px;
      }

      .sidebar-controls {
        display: flex;
        gap: 4px;
      }

      .player-source-bar {
        display: grid;
        grid-template-columns: minmax(190px, 260px) minmax(220px, 1fr) auto;
        gap: 10px;
        align-items: end;
        padding: 12px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 16px;
        background: rgba(11, 17, 28, 0.76);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.16);
        backdrop-filter: blur(14px) saturate(130%);
      }

      .player-source-bar label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .player-source-bar select,
      .player-source-bar input {
        min-height: 36px;
        width: 100%;
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 10px;
        padding: 7px 12px;
        color: #f7f8ff;
        background: #0f1726 !important;
        font: inherit;
      }

      :root[data-theme="light"] .player-source-bar select,
      :root[data-theme="light"] .player-source-bar input,
      :root[data-theme="light"] .episodes-search input,
      :root[data-theme="light"] .player-settings-panel select {
        border-color: rgba(61, 83, 112, 0.2);
        color: #172234;
        background: #f7faff !important;
      }

      .player-source-bar span {
        font-size: 12px;
        padding-bottom: 8px;
        white-space: nowrap;
      }

      .episodes-search {
        display: none;
        padding: 0 6px;
      }

      .episodes-search.show {
        display: block;
      }

      .episodes-search input {
        width: 100%;
        min-height: 36px;
        border-radius: 10px;
        padding: 0 12px;
        border: 1px solid var(--line);
        background: color-mix(in srgb, var(--solid) 60%, transparent);
        color: var(--text);
      }

      .episodes-search input:focus {
        border-color: color-mix(in srgb, var(--blue) 70%, transparent);
        outline: none;
      }

      .episodes-list {
        display: grid;
        gap: 8px;
        overflow-y: auto;
        padding: 0 4px 4px;
        max-height: calc(100vh - 86px);
      }

      .episodes-list::-webkit-scrollbar {
        width: 6px;
      }

      .episodes-list::-webkit-scrollbar-thumb {
        background: rgba(72, 219, 251, 0.3);
        border-radius: 3px;
      }

      .episodes-loading {
        display: grid;
        gap: 12px;
        place-items: center;
        padding: 24px;
        color: var(--muted);
      }

      .episode-item {
        display: grid;
        grid-template-columns: 86px minmax(0, 1fr);
        grid-template-areas:
          "thumb title"
          "thumb meta"
          "thumb state";
        gap: 4px 10px;
        min-width: 0;
        padding: 9px;
        border: 1px solid transparent;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.035);
        cursor: pointer;
        transition: all 200ms ease;
        text-align: left;
      }

      .episode-item:hover {
        border-color: rgba(72, 219, 251, 0.22);
        background: rgba(255, 255, 255, 0.07);
      }

      .episode-item.active {
        border-color: rgba(72, 219, 251, 0.42);
        background: linear-gradient(135deg, rgba(72, 219, 251, 0.16), rgba(255, 79, 195, 0.1));
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      }

      .episode-item.watched {
        opacity: 0.86;
      }

      .episode-thumb-wrap {
        position: relative;
        grid-area: thumb;
        min-height: 58px;
        overflow: hidden;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.08);
      }

      .episode-thumb {
        width: 100%;
        height: 100%;
        min-height: 58px;
        object-fit: cover;
        opacity: 0.78;
      }

      .episode-number {
        position: absolute;
        left: 6px;
        bottom: 6px;
        display: inline-grid;
        place-items: center;
        border-radius: 999px;
        padding: 4px 7px;
        background: rgba(3, 7, 18, 0.78);
        color: #fff;
        font-size: 11px;
        font-weight: 900;
      }

      :root[data-theme="light"] .episode-number {
        color: #fff;
        background: rgba(14, 29, 54, 0.78);
      }

      .episode-title {
        grid-area: title;
        margin: 0;
        font-size: 14px;
        color: var(--text);
        line-height: 1.2;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        overflow-wrap: anywhere;
      }

      .episode-air-date {
        grid-area: meta;
        font-size: 11px;
        color: var(--muted);
      }

      .episode-state {
        grid-area: state;
        font-size: 11px;
      }

      @media (max-width: 1200px) {
        .player-container {
          grid-template-columns: minmax(0, 1fr) minmax(300px, 360px);
        }
      }

      @media (max-width: 720px) {
        body[data-page="player"] main.shell {
          padding: 0 0 24px;
        }

        body[data-page="player"] > .topbar.shell {
          display: grid !important;
          grid-template-columns: 1fr;
          gap: 8px;
          padding: 8px 8px 10px !important;
        }

        body[data-page="player"] > .topbar.shell .brand {
          justify-self: start;
        }

        body[data-page="player"] > .topbar.shell .nav {
          display: grid !important;
          grid-template-columns: repeat(auto-fit, minmax(82px, 1fr)) !important;
          width: 100% !important;
        }

        .player-container {
          grid-template-columns: 1fr;
          gap: 12px;
        }

        .player-sidebar {
          max-height: none;
          position: static;
          padding: 10px 8px;
        }

        .episodes-list {
          max-height: none;
          overflow: visible;
        }

        .player-controls {
          grid-template-columns: 1fr;
        }

        .player-source-bar {
          grid-template-columns: 1fr;
          align-items: stretch;
        }

        .player-source-bar span {
          padding-bottom: 0;
          white-space: normal;
        }

        .custom-subtitles {
          bottom: 58px;
          max-width: 88%;
          font-size: 22px;
        }

        .custom-video-controls {
          left: 0;
          right: 0;
          bottom: 0;
          grid-template-columns: auto auto minmax(58px, auto) minmax(84px, 1fr) auto auto auto;
          gap: 5px;
          padding: 5px 8px 5px;
        }

        .video-time-range {
          min-width: 58px;
          font-size: 11px;
        }

        .video-control-btn {
          width: 28px;
          min-height: 28px;
        }

        .player-settings-panel {
          left: auto;
          right: 34px;
          bottom: 40px;
          width: min(270px, calc(100% - 46px));
          grid-template-columns: 1fr;
        }

        .video-player {
          aspect-ratio: 16 / 9;
          border-right: 0;
          border-left: 0;
          border-radius: 0;
        }

        .video-center-toggle {
          width: 52px;
          height: 52px;
          font-size: 22px;
        }

        .video-center-skip {
          width: 42px;
          height: 42px;
          font-size: 12px;
        }

        .video-center-skip-back {
          left: calc(50% - 104px);
        }

        .video-center-skip-forward {
          left: calc(50% + 62px);
        }
      }

      @media (max-width: 480px) {
        body[data-page="player"] main.shell {
          padding-inline: 6px;
        }

        .custom-video-controls {
          grid-template-columns: auto auto minmax(54px, auto) minmax(70px, 1fr) auto auto auto;
          grid-template-areas:
            "play volume time progress captions settings fullscreen";
        }

        .player-settings-panel {
          right: 8px;
          width: min(260px, calc(100% - 16px));
        }
      }

      /* Final streaming page polish. */
      body[data-page="player"] {
        --panel: #0b0b0d;
        --solid: #08090b;
        --soft: rgba(255, 255, 255, 0.075);
        --line: rgba(255, 255, 255, 0.12);
        background:
          radial-gradient(circle at 20% -12%, rgba(20, 185, 198, 0.14), transparent 34rem),
          radial-gradient(circle at 100% 0, rgba(255, 95, 200, 0.08), transparent 28rem),
          linear-gradient(180deg, #020202 0, #000 340px, #000 100%) !important;
        font-family: "Overpass", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body[data-page="player"] > .topbar.shell {
        position: sticky !important;
        top: 0;
        z-index: 1800;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
        background: rgba(4, 5, 7, 0.86) !important;
        backdrop-filter: blur(18px) saturate(130%);
      }

      body[data-page="player"] > .topbar.shell .nav a {
        border-radius: 999px;
        padding: 9px 12px;
        color: rgba(255, 255, 255, 0.64) !important;
        font-size: 13px;
      }

      body[data-page="player"] > .topbar.shell .nav a.active,
      body[data-page="player"] > .topbar.shell .nav a:hover {
        color: #effcff !important;
        background: rgba(20, 185, 198, 0.14) !important;
      }

      body[data-page="player"] main.shell {
        padding-top: 14px;
      }

      .player-container {
        grid-template-columns: minmax(0, 1fr) minmax(300px, 360px);
        gap: 18px;
        margin-top: 0;
      }

      .video-player,
      .player-controls,
      .player-source-bar,
      .episode-card,
      .player-sidebar {
        border-color: rgba(255, 255, 255, 0.1) !important;
        background: rgba(9, 10, 13, 0.9) !important;
        box-shadow: 0 26px 80px rgba(0, 0, 0, 0.34) !important;
      }

      .video-player,
      .player-controls,
      .player-source-bar,
      .episode-card,
      .player-sidebar {
        border-radius: 14px;
      }

      .player-info h2 {
        color: #fff;
        font-size: clamp(16px, 1.4vw, 20px);
        font-weight: 950;
        letter-spacing: -0.035em;
      }

      .player-actions .btn,
      .player-actions .icon-btn,
      .player-app-settings,
      .player-settings-link {
        min-height: 38px;
        border-radius: 10px;
        box-shadow: none !important;
        text-decoration: none;
        white-space: nowrap;
      }

      .player-actions .btn.secondary,
      .player-app-settings {
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.78) !important;
        background: #17191f !important;
      }

      .player-app-settings:hover,
      .player-settings-link:hover {
        color: #effcff !important;
        background: #26383d !important;
      }

      .player-settings-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 4px;
        border: 1px solid rgba(20, 185, 198, 0.24);
        color: #dff7fa;
        background: rgba(20, 185, 198, 0.11);
        font-size: 12px;
        font-weight: 900;
      }

      .player-source-bar {
        grid-template-columns: minmax(190px, 240px) minmax(240px, 1fr) auto;
      }

      .player-sidebar {
        top: 78px;
        max-height: calc(100vh - 92px);
      }

      .episode-item {
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.045);
      }

      .episode-item.active {
        border-color: rgba(20, 185, 198, 0.42);
        background: rgba(20, 185, 198, 0.14);
      }

      @media (max-width: 920px) {
        .player-container {
          grid-template-columns: 1fr;
        }

        .player-sidebar {
          position: static;
          max-height: none;
        }
      }

      @media (max-width: 720px) {
        body[data-page="player"] > .topbar.shell {
          position: static !important;
        }

        body[data-page="player"] > .topbar.shell .nav {
          display: flex !important;
          overflow-x: auto;
          grid-template-columns: none !important;
        }

        body[data-page="player"] > .topbar.shell .nav a {
          flex: 0 0 auto;
        }

        .player-actions {
          flex-wrap: wrap;
          justify-content: flex-start;
        }
      }
    </style>
  </body>
</html>

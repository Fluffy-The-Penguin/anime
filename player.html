<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Stream your anime with episode details and tracking." />
    <title>AniTrack | Player</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body data-page="player">
    <header class="topbar shell">
      <a class="brand" href="index.html"><span>AT</span>AniTrack</a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="anime.html">Anime</a>
        <a href="manga.html">Manga</a>
        <a href="library.html">Library</a>
      </nav>
    </header>

    <main class="shell">
      <div class="player-container">
        <!-- Video Player Section -->
        <section class="player-main">
          <div class="video-wrapper">
            <div class="video-player" data-video-player>
              <div class="player-loading">
                <div class="spinner"></div>
                <p>Loading episode...</p>
              </div>
            </div>
            <div class="player-controls" data-player-controls>
              <div class="player-info">
                <h2 data-episode-title>Episode Loading...</h2>
                <p data-episode-number class="muted"></p>
              </div>
              <div class="player-actions">
                <button class="btn secondary" data-mark-watched type="button">Mark as Watched</button>
                <button class="icon-btn" data-fullscreen-btn type="button" aria-label="Fullscreen">⛶</button>
              </div>
            </div>
          </div>

          <!-- Episode Info Card -->
          <div class="episode-card panel">
            <div class="episode-meta">
              <span data-episode-release class="muted">Release Date: TBA</span>
              <span data-episode-rating class="muted">Rating: TBA</span>
            </div>
            <div data-episode-description></div>
            <div class="streaming-sources" data-streaming-sources>
              <p class="muted">Loading sources...</p>
            </div>
          </div>
        </section>

        <!-- Sidebar: Episodes List -->
        <aside class="player-sidebar">
          <div class="sidebar-head">
            <h3 data-anime-title>Episodes</h3>
            <div class="sidebar-controls">
              <button class="icon-btn" data-episodes-search-toggle type="button" aria-label="Search episodes">🔍</button>
              <button class="icon-btn" data-sort-episodes type="button" aria-label="Sort episodes">↕</button>
            </div>
          </div>

          <div class="episodes-search" data-episodes-search>
            <input type="search" placeholder="Search episodes..." aria-label="Search episodes">
          </div>

          <div class="episodes-list" data-episodes-list>
            <div class="episodes-loading">
              <div class="spinner"></div>
              <p>Loading episodes...</p>
            </div>
          </div>
        </aside>
      </div>
    </main>

    <style>
      body[data-page="player"] {
        background: linear-gradient(145deg, #000 0%, var(--bg-2) 54%, #000 100%);
      }

      .player-container {
        display: grid;
        grid-template-columns: minmax(0, 2fr) 380px;
        gap: 24px;
        margin: 24px 0;
        align-items: start;
      }

      .player-main {
        display: grid;
        gap: 18px;
      }

      .video-wrapper {
        display: grid;
        gap: 16px;
      }

      .video-player {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: #000;
        overflow: hidden;
        display: grid;
        place-items: center;
      }

      .player-loading {
        display: grid;
        gap: 16px;
        place-items: center;
        color: var(--muted);
      }

      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(72, 219, 251, 0.2);
        border-top-color: var(--blue);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .video-player video {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .player-controls {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 16px;
        align-items: center;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: color-mix(in srgb, var(--solid) 50%, transparent);
      }

      .player-info h2 {
        margin: 0 0 6px;
        font-size: 20px;
      }

      .player-info p {
        margin: 0;
        font-size: 13px;
      }

      .player-actions {
        display: flex;
        gap: 8px;
      }

      .episode-card {
        border-radius: 18px;
        padding: 20px;
      }

      .episode-meta {
        display: flex;
        gap: 16px;
        margin-bottom: 16px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }

      .episode-meta span {
        font-size: 13px;
      }

      [data-episode-description] {
        margin-bottom: 18px;
        line-height: 1.6;
        color: var(--text);
      }

      .streaming-sources {
        display: grid;
        gap: 10px;
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }

      .source-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: color-mix(in srgb, var(--soft) 60%, transparent);
        transition: all 200ms ease;
      }

      .source-item:hover {
        border-color: color-mix(in srgb, var(--blue) 50%, var(--line));
        background: color-mix(in srgb, var(--soft) 80%, transparent);
      }

      .source-info h4 {
        margin: 0 0 4px;
        font-size: 14px;
        color: var(--text);
        font-weight: 700;
      }

      .source-info p {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
      }

      .source-play {
        padding: 6px 12px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--blue), var(--mint));
        color: #06101a;
        border: none;
        font-weight: 700;
        cursor: pointer;
        font-size: 12px;
        white-space: nowrap;
      }

      .player-sidebar {
        display: grid;
        gap: 12px;
        align-content: start;
        max-height: calc(100vh - 150px);
        position: sticky;
        top: 100px;
      }

      .sidebar-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 0 6px;
      }

      .sidebar-head h3 {
        margin: 0;
        font-size: 18px;
      }

      .sidebar-controls {
        display: flex;
        gap: 4px;
      }

      .episodes-search {
        display: none;
        padding: 0 6px;
      }

      .episodes-search.show {
        display: block;
      }

      .episodes-search input {
        width: 100%;
        min-height: 36px;
        border-radius: 10px;
        padding: 0 12px;
        border: 1px solid var(--line);
        background: color-mix(in srgb, var(--solid) 60%, transparent);
        color: var(--text);
      }

      .episodes-search input:focus {
        border-color: color-mix(in srgb, var(--blue) 70%, transparent);
        outline: none;
      }

      .episodes-list {
        display: grid;
        gap: 8px;
        overflow-y: auto;
        padding: 0 6px;
        max-height: 100%;
      }

      .episodes-list::-webkit-scrollbar {
        width: 6px;
      }

      .episodes-list::-webkit-scrollbar-thumb {
        background: rgba(72, 219, 251, 0.3);
        border-radius: 3px;
      }

      .episodes-loading {
        display: grid;
        gap: 12px;
        place-items: center;
        padding: 24px;
        color: var(--muted);
      }

      .episode-item {
        display: grid;
        gap: 6px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: color-mix(in srgb, var(--soft) 50%, transparent);
        cursor: pointer;
        transition: all 200ms ease;
        text-align: left;
      }

      .episode-item:hover {
        border-color: color-mix(in srgb, var(--blue) 50%, var(--line));
        background: color-mix(in srgb, var(--soft) 70%, transparent);
      }

      .episode-item.active {
        border-color: var(--blue);
        background: linear-gradient(135deg, rgba(var(--theme-primary-rgb), 0.2), transparent);
        box-shadow: 0 0 16px rgba(var(--theme-primary-rgb), 0.2);
      }

      .episode-item.watched {
        opacity: 0.6;
      }

      .episode-number {
        font-size: 13px;
        color: var(--blue);
        font-weight: 700;
      }

      .episode-title {
        margin: 0;
        font-size: 14px;
        color: var(--text);
        line-height: 1.2;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .episode-air-date {
        font-size: 11px;
        color: var(--muted);
      }

      @media (max-width: 1200px) {
        .player-container {
          grid-template-columns: 1fr;
        }

        .player-sidebar {
          max-height: 400px;
          position: static;
          top: auto;
        }
      }

      @media (max-width: 720px) {
        .player-controls {
          grid-template-columns: 1fr;
        }

        .player-actions {
          width: 100%;
        }

        .player-actions .btn,
        .player-actions .icon-btn {
          flex: 1;
        }

        .video-player {
          aspect-ratio: 9 / 16;
        }
      }
    </style>
  </body>
</html>

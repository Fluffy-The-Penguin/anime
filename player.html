<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Stream your anime with episode details and tracking." />
    <title>AniTrack | Player</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js?v=anilist-proxy" defer></script>
  </head>
  <body data-page="player">
    <header class="topbar shell">
      <a class="brand" href="index.html"><span>AT</span>AniTrack</a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="anime.html">Anime</a>
        <a href="manga.html">Manga</a>
        <a href="library.html">Library</a>
      </nav>
    </header>

    <main class="shell">
      <div class="player-container">
        <!-- Video Player Section -->
        <section class="player-main">
          <div class="video-wrapper">
            <div class="video-player" data-video-player>
              <div class="player-loading">
                <div class="spinner"></div>
                <p>Loading episode...</p>
              </div>
            </div>
            <div class="player-controls" data-player-controls>
              <div class="player-info">
                <h2 data-episode-title>Episode Loading...</h2>
                <p data-episode-number class="muted"></p>
              </div>
              <div class="player-actions">
                <button class="icon-btn subtitle-toggle" data-subtitle-toggle type="button" aria-label="Toggle subtitles" aria-pressed="true" hidden>CC</button>
                <button class="icon-btn" data-player-settings-toggle type="button" aria-label="Player settings" aria-expanded="false">⚙</button>
                <button class="btn secondary" data-mark-watched type="button">Mark as Watched</button>
                <button class="icon-btn" data-fullscreen-btn type="button" aria-label="Fullscreen">⛶</button>
              </div>
            </div>
            <div class="player-settings-panel" data-player-settings-panel hidden>
              <label>Quality <select data-player-quality><option value="">Auto / selected source</option></select></label>
              <label>Speed <select data-player-speed><option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option></select></label>
              <label>Subtitles <select data-player-subtitles><option value="off">Off</option></select></label>
              <label>Audio <select data-player-audio><option value="default">Default audio</option></select></label>
              <div class="player-check-row">
                <label class="player-check"><input data-player-auto-play type="checkbox"> Auto play</label>
                <label class="player-check"><input data-player-auto-next type="checkbox"> Auto next</label>
              </div>
            </div>
          </div>

          <!-- Episode Info Card -->
          <div class="episode-card panel">
            <div class="episode-meta">
              <span data-episode-release class="muted">Release Date: TBA</span>
              <span data-episode-rating class="muted">Rating: TBA</span>
            </div>
            <div data-episode-description></div>
            <div class="streaming-sources" data-streaming-sources>
              <p class="muted">Loading sources...</p>
            </div>
          </div>
        </section>

        <!-- Sidebar: Episodes List -->
        <aside class="player-sidebar">
          <div class="sidebar-head">
            <h3 data-anime-title>Episodes</h3>
            <div class="sidebar-controls">
              <button class="icon-btn" data-episodes-search-toggle type="button" aria-label="Search episodes">🔍</button>
              <button class="icon-btn" data-sort-episodes type="button" aria-label="Sort episodes">↕</button>
            </div>
          </div>

          <div class="episodes-search" data-episodes-search>
            <input type="search" placeholder="Search episodes..." aria-label="Search episodes">
          </div>

          <div class="episodes-list" data-episodes-list>
            <div class="episodes-loading">
              <div class="spinner"></div>
              <p>Loading episodes...</p>
            </div>
          </div>
        </aside>
      </div>
    </main>

    <style>
      body[data-page="player"] {
        background: #000;
      }

      body[data-page="player"] .topbar,
      body[data-page="player"] .mobile-bottom-nav,
      body[data-page="player"] .site-footer {
        display: none;
      }

      body[data-page="player"] main.shell {
        width: min(100%, 1320px);
        padding: 10px clamp(8px, 2vw, 18px) 24px;
      }

      .player-container {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
        margin: 0;
        align-items: start;
      }

      .player-main {
        display: grid;
        gap: 18px;
      }

      .video-wrapper {
        position: relative;
        display: grid;
        gap: 8px;
      }

      .video-player {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        background: #000;
        overflow: hidden;
        display: grid;
        place-items: center;
      }

      .player-loading {
        display: grid;
        gap: 16px;
        place-items: center;
        color: var(--muted);
      }

      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(72, 219, 251, 0.2);
        border-top-color: var(--blue);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .video-player video {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .video-player video::-webkit-media-controls-fullscreen-button {
        display: none;
      }

      .custom-video-controls {
        position: absolute;
        left: 14px;
        right: 14px;
        bottom: 14px;
        z-index: 8;
        display: grid;
        grid-template-columns: auto auto auto 1fr auto auto auto;
        align-items: center;
        gap: 8px;
        padding: 6px 9px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 11px;
        background: rgba(8, 12, 18, 0.68);
        backdrop-filter: blur(18px) saturate(130%);
        transition: opacity 160ms ease, transform 160ms ease;
      }

      .video-controls-idle .custom-video-controls {
        opacity: 0;
        pointer-events: none;
        transform: translateY(16px);
      }

      .video-control-btn {
        width: 30px;
        min-height: 30px;
        border: 0;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.1);
        color: var(--text);
        font-weight: 900;
        cursor: pointer;
      }

      .video-control-btn.active {
        background: linear-gradient(135deg, var(--blue), var(--mint));
        color: #06101a;
      }

      .video-control-btn:disabled {
        opacity: 0.42;
        cursor: not-allowed;
      }

      .video-volume-control {
        position: relative;
        display: grid;
        place-items: center;
      }

      .video-volume-control.volume-open .video-control-btn {
        background: rgba(255, 255, 255, 0.18);
      }

      .video-volume-panel {
        position: absolute;
        left: 50%;
        bottom: 38px;
        z-index: 10;
        display: grid;
        place-items: center;
        width: 46px;
        height: 138px;
        padding: 12px 8px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 14px;
        background: rgba(8, 12, 18, 0.82);
        box-shadow: 0 14px 44px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(18px) saturate(130%);
        transform: translateX(-50%);
      }

      .video-volume-panel[hidden] {
        display: none !important;
        pointer-events: none !important;
      }

      .video-time {
        color: rgba(255, 255, 255, 0.82);
        font-size: 12px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .video-time-range {
        min-width: 86px;
      }

      .video-progress {
        width: 100%;
        accent-color: var(--blue);
      }

      .video-volume {
        width: 28px;
        height: 112px;
        accent-color: var(--blue);
        direction: rtl;
        writing-mode: vertical-lr;
      }

      .custom-subtitles {
        position: absolute;
        left: 50%;
        bottom: var(--subtitle-base-offset, 58px);
        z-index: 4;
        max-width: min(78%, 860px);
        padding: 8px 14px 10px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 16px;
        color: rgba(255, 255, 255, 0.96);
        background: rgba(8, 10, 14, 0.46);
        box-shadow: 0 14px 44px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(14px) saturate(130%);
        text-align: center;
        font-size: 28px;
        line-height: 1.18;
        letter-spacing: -0.03em;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.72);
        transform: translate(-50%, 8px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 130ms ease, transform 130ms ease;
      }

      .custom-subtitles.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .video-player:not(.video-controls-idle) .custom-subtitles {
        bottom: var(--subtitle-controls-offset, 110px);
      }

      .video-player.player-settings-open .custom-subtitles {
        bottom: var(--subtitle-settings-offset, 192px);
      }

      .custom-subtitles.subtitle-top,
      .video-player:not(.video-controls-idle) .custom-subtitles.subtitle-top,
      .video-player.player-settings-open .custom-subtitles.subtitle-top {
        top: var(--subtitle-base-offset, 58px);
        bottom: auto;
      }

      .player-controls {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 9px 11px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.045);
        backdrop-filter: blur(18px);
      }

      .video-wrapper:fullscreen,
      .video-wrapper.player-fullscreen {
        width: 100vw;
        height: 100vh;
        background: #000;
        display: block;
        overflow: hidden;
      }

      .video-wrapper:fullscreen .video-player,
      .video-wrapper.player-fullscreen .video-player {
        width: 100%;
        height: 100%;
        aspect-ratio: auto;
        border: 0;
        border-radius: 0;
      }

      .video-wrapper:fullscreen .player-controls,
      .video-wrapper.player-fullscreen .player-controls {
        display: none;
      }

      .video-wrapper:fullscreen .player-settings-panel,
      .video-wrapper.player-fullscreen .player-settings-panel {
        bottom: 116px;
      }

      .video-wrapper:fullscreen .custom-subtitles,
      .video-wrapper.player-fullscreen .custom-subtitles {
        z-index: 7;
        bottom: clamp(68px, 9vh, 110px);
      }

      .video-wrapper:fullscreen .video-player:not(.video-controls-idle) .custom-subtitles,
      .video-wrapper.player-fullscreen .video-player:not(.video-controls-idle) .custom-subtitles {
        bottom: clamp(112px, 15vh, 160px);
      }

      .video-wrapper:fullscreen .video-player.player-settings-open .custom-subtitles,
      .video-wrapper.player-fullscreen .video-player.player-settings-open .custom-subtitles {
        bottom: clamp(210px, 29vh, 300px);
      }

      .video-wrapper:fullscreen .custom-video-controls,
      .video-wrapper.player-fullscreen .custom-video-controls {
        bottom: 12px;
      }

      .video-wrapper.player-fullscreen.player-fs-idle .player-settings-panel[hidden] {
        opacity: 0;
        pointer-events: none;
        transform: translateY(18px);
      }

      .player-info h2 {
        margin: 0 0 6px;
        font-size: 15px;
      }

      .player-info p {
        margin: 0;
        font-size: 13px;
      }

      .player-actions {
        display: flex;
        gap: 8px;
      }

      .player-settings-panel {
        position: absolute;
        right: 14px;
        bottom: 120px;
        z-index: 9;
        display: grid;
        grid-template-columns: repeat(2, minmax(160px, 1fr));
        gap: 10px;
        width: min(520px, calc(100% - 28px));
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        background: rgba(8, 12, 18, 0.82);
        backdrop-filter: blur(18px) saturate(130%);
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .player-settings-panel[hidden] {
        display: none !important;
        pointer-events: none !important;
      }

      .player-settings-panel label {
        display: grid;
        gap: 4px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .player-settings-panel select {
        min-height: 32px;
        border-radius: 9px;
        font-size: 12px;
      }

      .player-settings-panel .player-check {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 36px;
        padding: 0;
      }

      .player-settings-panel .player-check-row {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 2px 4px 0;
      }

      .player-settings-panel .player-check input {
        width: auto;
        min-height: auto;
      }

      .subtitle-toggle {
        min-width: 48px;
        border-radius: 12px;
        font-size: 12px;
        letter-spacing: 0.04em;
      }

      .subtitle-toggle.active {
        color: #06101a;
        border-color: transparent;
        background: linear-gradient(135deg, var(--blue), var(--mint));
      }

      .episode-card {
        border-radius: 14px;
        padding: 14px;
        background: rgba(255, 255, 255, 0.035);
      }

      .episode-meta {
        display: flex;
        gap: 16px;
        margin-bottom: 16px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }

      .episode-meta span {
        font-size: 13px;
      }

      [data-episode-description] {
        margin-bottom: 12px;
        line-height: 1.6;
        color: var(--text);
        font-size: 13px;
      }

      .streaming-sources {
        display: grid;
        gap: 10px;
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }

      .scrollable-source-section {
        display: grid;
        gap: 8px;
        margin-bottom: 12px;
      }

      .source-section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .source-section-head h4 {
        margin: 0;
        font-size: 14px;
      }

      .source-section-head span {
        color: var(--muted);
        font-size: 12px;
      }

      .source-scroll-list {
        display: grid;
        gap: 8px;
        max-height: 320px;
        overflow: auto;
        padding-right: 4px;
      }

      .source-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: color-mix(in srgb, var(--soft) 60%, transparent);
        transition: all 200ms ease;
      }

      .source-item:hover {
        border-color: color-mix(in srgb, var(--blue) 50%, var(--line));
        background: color-mix(in srgb, var(--soft) 80%, transparent);
      }

      .source-info h4 {
        margin: 0 0 4px;
        font-size: 14px;
        color: var(--text);
        font-weight: 700;
      }

      .source-info p {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
      }

      .source-play {
        padding: 6px 12px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--blue), var(--mint));
        color: #06101a;
        border: none;
        font-weight: 700;
        cursor: pointer;
        font-size: 12px;
        white-space: nowrap;
      }

      .player-sidebar {
        display: grid;
        gap: 10px;
        align-content: start;
        max-height: none;
        position: static;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        padding: 12px;
        background: rgba(255, 255, 255, 0.035);
      }

      .sidebar-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 0 6px;
      }

      .sidebar-head h3 {
        margin: 0;
        font-size: 18px;
      }

      .sidebar-controls {
        display: flex;
        gap: 4px;
      }

      .episodes-search {
        display: none;
        padding: 0 6px;
      }

      .episodes-search.show {
        display: block;
      }

      .episodes-search input {
        width: 100%;
        min-height: 36px;
        border-radius: 10px;
        padding: 0 12px;
        border: 1px solid var(--line);
        background: color-mix(in srgb, var(--solid) 60%, transparent);
        color: var(--text);
      }

      .episodes-search input:focus {
        border-color: color-mix(in srgb, var(--blue) 70%, transparent);
        outline: none;
      }

      .episodes-list {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 0 6px 4px;
        max-height: none;
      }

      .episodes-list::-webkit-scrollbar {
        width: 6px;
      }

      .episodes-list::-webkit-scrollbar-thumb {
        background: rgba(72, 219, 251, 0.3);
        border-radius: 3px;
      }

      .episodes-loading {
        display: grid;
        gap: 12px;
        place-items: center;
        padding: 24px;
        color: var(--muted);
      }

      .episode-item {
        display: grid;
        gap: 6px;
        min-width: 180px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: color-mix(in srgb, var(--soft) 50%, transparent);
        cursor: pointer;
        transition: all 200ms ease;
        text-align: left;
      }

      .episode-item:hover {
        border-color: color-mix(in srgb, var(--blue) 50%, var(--line));
        background: color-mix(in srgb, var(--soft) 70%, transparent);
      }

      .episode-item.active {
        border-color: var(--blue);
        background: linear-gradient(135deg, rgba(var(--theme-primary-rgb), 0.2), transparent);
        box-shadow: 0 0 16px rgba(var(--theme-primary-rgb), 0.2);
      }

      .episode-item.watched {
        opacity: 0.6;
      }

      .episode-number {
        font-size: 13px;
        color: var(--blue);
        font-weight: 700;
      }

      .episode-title {
        margin: 0;
        font-size: 14px;
        color: var(--text);
        line-height: 1.2;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .episode-air-date {
        font-size: 11px;
        color: var(--muted);
      }

      @media (max-width: 1200px) {
        .player-container {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 720px) {
        .player-controls {
          grid-template-columns: 1fr;
        }

        .custom-subtitles {
          bottom: 58px;
          max-width: 88%;
          font-size: 22px;
        }

        .player-actions {
          width: 100%;
        }

        .player-settings-panel {
          grid-template-columns: 1fr 1fr;
        }

        .custom-video-controls {
          left: 8px;
          right: 8px;
          bottom: 8px;
          grid-template-columns: auto auto auto 1fr auto auto auto;
          gap: 5px;
          padding: 6px;
        }

        .player-settings-panel {
          left: 8px;
          right: 8px;
          bottom: 104px;
          width: auto;
          grid-template-columns: 1fr 1fr;
        }

        .player-actions .btn,
        .player-actions .icon-btn {
          flex: 1;
        }

        .video-player {
          aspect-ratio: 16 / 9;
          border-radius: 10px;
        }
      }
    </style>
  </body>
</html>

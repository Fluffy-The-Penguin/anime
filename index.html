<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A professional anime and manga tracker powered by AniList data." />
    <title>AniTrack | Home</title>
    <link rel="stylesheet" href="styles.css?v=home-profile-links-1" />
    <script src="app.js?v=home-profile-links-1" defer></script>
  </head>
  <body data-page="home">
    <header class="topbar shell anilist-topbar">
      <a class="brand anilist-brand" href="index.html" aria-label="AniTrack home"><span>A</span><i>L</i></a>
      <nav class="nav anilist-nav" aria-label="Primary navigation">
        <a class="active" href="index.html">Home</a>
        <a href="profile.html">Profile</a>
        <a href="anime-library.html">Anime List</a>
        <a href="manga-library.html">Manga List</a>
        <a href="anime.html">Browse</a>
        <a href="settings.html">Forum</a>
      </nav>
    </header>

    <main class="home-social-page shell">
      <section class="home-activity-column">
        <div class="home-section-head">
          <h1>Activity</h1>
          <div class="home-feed-tabs" aria-label="Activity feed scope">
            <button class="active" type="button">Following</button>
            <button type="button">Global</button>
          </div>
        </div>
        <div class="home-status-input">Write a status...</div>
        <div class="home-activity-list" data-home-activity aria-live="polite"></div>
      </section>

      <aside class="home-progress-column">
        <h2>Anime in Progress</h2>
        <div class="home-progress-grid" data-home-progress aria-live="polite"></div>
      </aside>
    </main>
  </body>
</html>

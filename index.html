<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AniTrack home activity, anime progress, and manga tracking." />
    <title>AniTrack | Home</title>
    <link rel="stylesheet" href="styles.css?v=site-fix-15" />
    <script src="app.js?v=site-fix-15" defer></script>
  </head>
  <body data-page="home">
    <header class="topbar shell anilist-topbar">
      <a class="brand anilist-brand" href="index.html" aria-label="AniTrack home"><span>AT</span><b>AniTrack</b></a>
      <nav class="nav anilist-nav" aria-label="Primary navigation">
        <a class="active" href="index.html">Home</a>
        <a href="anime.html">Anime</a>
        <a href="manga.html">Manga / Manhwa</a>
        <a href="doujin.html" data-adult-nav hidden>Doujin</a>
        <a href="profile.html">Profile</a>
      </nav>
    </header>

    <main class="home-social-page shell">
      <section class="home-activity-column">
        <div class="home-section-head">
          <h1>Activity</h1>
          <div class="home-feed-tabs" aria-label="Activity feed scope">
            <button class="active" type="button">Following</button>
            <button type="button">Global</button>
          </div>
        </div>
        <div class="home-status-input">Write a status...</div>
        <div class="home-activity-list" data-home-activity aria-live="polite"></div>
      </section>

      <aside class="home-progress-column">
        <section class="home-progress-section" data-home-progress-section="anime">
          <h2>Anime in Progress</h2>
          <div class="home-progress-grid" data-home-progress aria-live="polite"></div>
        </section>
        <section class="home-progress-section" data-home-progress-section="manga">
          <h2>Manga in Progress</h2>
          <div class="home-progress-grid" data-home-manga-progress aria-live="polite"></div>
        </section>
        <section class="home-progress-section" data-home-progress-section="pornhwa">
          <h2>Pornhwa in Progress</h2>
          <div class="home-progress-grid" data-home-pornhwa-progress aria-live="polite"></div>
        </section>
        <section class="home-progress-section" data-home-progress-section="hentai">
          <h2>Hentai in Progress</h2>
          <div class="home-progress-grid" data-home-hentai-progress aria-live="polite"></div>
        </section>
        <section class="home-progress-section" data-home-progress-section="doujin">
          <h2>Doujin in Progress</h2>
          <div class="home-progress-grid" data-home-doujin-progress aria-live="polite"></div>
        </section>
      </aside>
    </main>
  </body>
</html>

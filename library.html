<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Your local anime and manga tracking library." />
    <title>AniTrack | Library</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js?v=vertical-volume-popover" defer></script>
  </head>
  <body data-page="library">
    <header class="topbar shell">
      <a class="brand" href="index.html"><span>AT</span>AniTrack</a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="anime.html">Anime</a>
        <a href="manga.html">Manga</a>
        <a class="active" href="library.html">Library</a>
      </nav>
    </header>

    <main class="shell">
      <section class="panel section">
        <div class="section-head">
          <div>
            <span class="eyebrow">Saved locally</span>
            <h2>Library</h2>
          </div>
          <div class="chips" data-library-filters>
            <button class="chip active" data-filter="all">All</button>
            <button class="chip" data-filter="watching">Watching</button>
            <button class="chip" data-filter="reading">Reading</button>
            <button class="chip" data-filter="planning">Planning</button>
            <button class="chip" data-filter="completed">Completed</button>
            <button class="chip" data-filter="dropped">Dropped</button>
          </div>
        </div>
        <div class="library-columns">
          <section class="library-group">
            <div class="library-group-head">
              <div>
                <span class="eyebrow">Anime</span>
                <h3>Anime Library</h3>
              </div>
              <span class="library-count" data-anime-count>0 titles</span>
            </div>
            <div class="library-list" data-library-list="anime" aria-live="polite"></div>
          </section>

          <section class="library-group">
            <div class="library-group-head">
              <div>
                <span class="eyebrow">Manga</span>
                <h3>Manga Library</h3>
              </div>
              <span class="library-count" data-manga-count>0 titles</span>
            </div>
            <div class="library-list" data-library-list="manga" aria-live="polite"></div>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>

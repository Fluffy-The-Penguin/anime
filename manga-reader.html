<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Read manga with chapter details and tracking." />
    <title>AniTrack | Manga Reader</title>
    <link rel="stylesheet" href="styles.css?v=details-library-popover" />
    <script src="app.js?v=details-library-popover" defer></script>
  </head>
  <body data-page="reader">
    <header class="topbar shell">
      <a class="brand" href="index.html"><span>AT</span>AniTrack</a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="anime.html">Anime</a>
        <a href="manga.html">Manga</a>
        <a href="library.html">Library</a>
      </nav>
    </header>

    <main class="shell">
      <div class="reader-container">
        <!-- Reader Main Section -->
        <section class="reader-main">
          <button class="reader-back-button" data-reader-back type="button" aria-label="Go back">&lt;- Back</button>

          <div class="reader-header">
            <h2 data-manga-title>Manga Title</h2>
            <div class="reader-top-actions">
              <button class="icon-btn" data-fullscreen-btn type="button" aria-label="Fullscreen">⛶</button>
              <button class="icon-btn" data-settings-btn type="button" aria-label="Reader settings">⚙</button>
            </div>
          </div>

          <div class="reader-source-bar" data-manga-source-bar hidden>
            <label for="manga-source-select">Source</label>
            <select id="manga-source-select" data-manga-source-select></select>
            <span class="muted" data-manga-source-status>Searching sources...</span>
          </div>

          <div class="reader-control-bar">
            <label for="chapter-select">Chapter</label>
            <select id="chapter-select" data-chapter-select>
              <option>Loading chapters...</option>
            </select>
            <label for="reading-mode">Mode</label>
            <select id="reading-mode" data-reading-mode>
              <option value="webtoon">Webtoon</option>
              <option value="vertical">Vertical continuous</option>
              <option value="single">Single paged</option>
              <option value="double">Double paged</option>
            </select>
          </div>

          <div class="chapters-list" data-chapters-list hidden></div>

          <div class="chapter-display" data-chapter-display>
            <div class="reader-loading">
              <div class="spinner"></div>
              <p>Loading chapter...</p>
            </div>
          </div>

          <!-- Manga source status -->
          <div class="manga-sources-card" data-manga-sources>
            <p class="muted">No sources loaded</p>
          </div>

          <div class="reader-footer">
            <button class="btn secondary" data-prev-chapter type="button">← Previous</button>
            <span class="chapter-info" data-chapter-info>Chapter Loading</span>
            <button class="btn secondary" data-next-chapter type="button">Next →</button>
          </div>

          <button class="btn secondary reader-bottom-back" data-reader-back type="button">&lt;- Back</button>
        </section>

      </div>
    </main>

    <button class="reader-top-button" data-reader-top type="button" aria-label="Go to top">^</button>

    <style>
      body[data-page="reader"] {
        background: #000;
      }

      body[data-page="reader"] > .topbar {
        display: none !important;
      }

      body[data-page="reader"] main.shell {
        width: 100%;
      }

      .reader-container {
        display: block;
        margin: 0;
      }

      .reader-main {
        display: grid;
        gap: 8px;
      }

      .reader-header {
        display: none;
      }

      .reader-header h2 {
        margin: 0;
        font-size: 18px;
        flex: 1;
      }

      .reader-top-actions {
        display: flex;
        gap: 8px;
      }

      .reader-source-bar {
        display: none;
        grid-template-columns: auto minmax(180px, 360px) minmax(0, auto);
        gap: 10px;
        align-items: center;
        padding: 8px 12px;
        width: max-content;
        max-width: calc(100vw - 24px);
        border-radius: 14px;
        background: rgba(8, 10, 14, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.22);
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.42);
      }

      body.reader-controls-visible .reader-source-bar:not([hidden]) {
        display: grid;
      }

      .reader-source-bar label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .reader-source-bar .muted {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .reader-source-bar select {
        width: min(360px, 52vw);
        max-width: 100%;
        min-height: 36px;
        padding: 7px 10px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 9px;
        background: #171a20;
        color: #f7f8ff;
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .reader-control-bar {
        display: none;
        grid-template-columns: auto max-content auto max-content;
        gap: 10px;
        align-items: center;
        justify-content: start;
        padding: 8px 12px;
        max-width: calc(100vw - 24px);
        border-radius: 14px;
        background: rgba(8, 10, 14, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.22);
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.42);
      }

      body.reader-controls-visible .reader-control-bar {
        display: grid;
      }

      .reader-control-bar label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .reader-control-bar select {
        min-height: 36px;
        padding: 7px 10px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 9px;
        background: #171a20;
        color: #f7f8ff;
        font-size: 13px;
      }

      [data-chapter-select] {
        width: 92px;
      }

      [data-reading-mode] {
        width: 128px;
      }

      .chapter-display {
        min-height: 400px;
        border: 0;
        border-radius: 0;
        background: #000;
        padding: 0;
        overflow: hidden;
      }

      .chapter-display::-webkit-scrollbar {
        width: 6px;
      }

      .chapter-display::-webkit-scrollbar-thumb {
        background: rgba(72, 219, 251, 0.3);
        border-radius: 3px;
      }

      .reader-loading {
        display: grid;
        gap: 16px;
        place-items: center;
        height: 100%;
        color: #cfd3dc;
      }

      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(72, 219, 251, 0.2);
        border-top-color: var(--blue);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .chapter-page-image {
        display: block;
        max-width: 100%;
        object-fit: contain;
        background: #0a0a0a;
      }

      .reader-pages {
        display: grid;
        justify-items: center;
        gap: 12px;
      }

      .reader-pages[data-mode="webtoon"] {
        gap: 0;
      }

      .reader-pages[data-mode="webtoon"] .chapter-page-image {
        width: min(100%, 960px);
        border-radius: 0;
      }

      .reader-pages[data-mode="vertical"] .chapter-page-image {
        width: min(100%, 900px);
        border-radius: 8px;
      }

      .reader-pages[data-mode="single"] .chapter-page-image {
        width: auto;
        max-height: calc(100vh - 190px);
        border-radius: 8px;
      }

      .reader-pages[data-mode="double"] {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-items: start;
      }

      .reader-pages[data-mode="double"] .chapter-page-image {
        width: 100%;
        max-height: calc(100vh - 190px);
        border-radius: 8px;
      }

      .manga-sources-card {
        border: 0;
        background: transparent;
        padding: 8px 12px;
      }

      .reader-footer {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 16px;
        align-items: center;
        padding: 8px 12px 16px;
      }

      .chapter-info {
        text-align: center;
        color: var(--muted);
        font-size: 13px;
      }

      .reader-footer .btn {
        min-height: 38px;
      }

      .reader-back-button {
        display: none;
        align-items: center;
        position: static;
        top: max(12px, env(safe-area-inset-top));
        left: max(12px, env(safe-area-inset-left));
        z-index: 9999;
        min-height: 34px;
        border: 0;
        border-radius: 999px;
        padding: 0 12px;
        background: #181b22;
        color: #f7f8ff;
        font-size: 13px;
        font-weight: 800;
      }

      body.reader-controls-visible .reader-back-button {
        display: inline-flex;
        justify-self: start;
        margin: 12px 12px 0;
        background: rgba(18, 18, 20, 0.92);
        color: #f7f8ff;
        border: 1px solid rgba(255, 255, 255, 0.22);
      }

      body.reader-images-ready.reader-controls-visible .reader-back-button,
      body.reader-images-ready.reader-controls-visible .reader-source-bar,
      body.reader-images-ready.reader-controls-visible .reader-control-bar {
        position: fixed;
        z-index: 9999;
        margin: 0;
        backdrop-filter: blur(14px);
      }

      body.reader-images-ready.reader-controls-visible .reader-back-button {
        top: max(12px, env(safe-area-inset-top));
        left: max(12px, env(safe-area-inset-left));
      }

      body.reader-images-ready.reader-controls-visible .reader-source-bar:not([hidden]) {
        top: max(12px, env(safe-area-inset-top));
        left: max(106px, calc(env(safe-area-inset-left) + 106px));
        right: auto;
        grid-template-columns: auto minmax(180px, 360px) minmax(0, auto);
        justify-content: start;
      }

      body.reader-images-ready.reader-controls-visible .reader-control-bar {
        top: calc(max(12px, env(safe-area-inset-top)) + 52px);
        left: max(106px, calc(env(safe-area-inset-left) + 106px));
        width: max-content;
        transform: none;
      }

      .reader-bottom-back {
        justify-self: center;
        margin-bottom: 18px;
      }

      .reader-top-button {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 9999;
        display: none;
        place-items: center;
        width: 42px;
        height: 42px;
        border: 0;
        border-radius: 999px;
        background: #181b22;
        color: #f7f8ff;
        font-size: 20px;
        font-weight: 800;
        line-height: 1;
        opacity: 1;
      }

      body.reader-controls-visible .reader-top-button {
        display: grid;
      }

      .chapters-list[hidden] {
        display: none;
      }

      @media (max-width: 720px) {
        .reader-header {
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
        }

        .reader-header h2 {
          width: 100%;
        }

        .reader-footer {
          grid-template-columns: 1fr;
        }

        .reader-source-bar {
          grid-template-columns: 1fr;
          width: auto;
        }

        .reader-source-bar select {
          width: min(100%, calc(100vw - 48px));
        }

        .reader-control-bar {
          grid-template-columns: auto 92px auto 128px;
          overflow-x: auto;
        }

        body.reader-images-ready.reader-controls-visible .reader-source-bar:not([hidden]) {
          top: calc(max(12px, env(safe-area-inset-top)) + 46px);
          left: max(12px, env(safe-area-inset-left));
          right: max(12px, env(safe-area-inset-right));
          width: auto;
        }

        body.reader-images-ready.reader-controls-visible .reader-control-bar {
          top: calc(max(12px, env(safe-area-inset-top)) + 116px);
          left: max(12px, env(safe-area-inset-left));
          right: max(12px, env(safe-area-inset-right));
          width: auto;
          transform: none;
        }

        .reader-pages[data-mode="double"] {
          grid-template-columns: 1fr;
        }

        .chapter-display {
          min-height: 300px;
        }
      }
    </style>
  </body>
</html>

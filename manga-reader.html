<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Read manga with chapter details and tracking." />
    <title>AniTrack | Manga Reader</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body data-page="reader">
    <header class="topbar shell">
      <a class="brand" href="index.html"><span>AT</span>AniTrack</a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="anime.html">Anime</a>
        <a href="manga.html">Manga</a>
        <a href="library.html">Library</a>
      </nav>
    </header>

    <main class="shell">
      <div class="reader-container">
        <!-- Reader Main Section -->
        <section class="reader-main">
          <div class="reader-header">
            <h2 data-manga-title>Manga Title</h2>
            <div class="reader-top-actions">
              <button class="icon-btn" data-fullscreen-btn type="button" aria-label="Fullscreen">⛶</button>
              <button class="icon-btn" data-settings-btn type="button" aria-label="Reader settings">⚙</button>
            </div>
          </div>

          <div class="chapter-display" data-chapter-display>
            <div class="reader-loading">
              <div class="spinner"></div>
              <p>Loading chapter...</p>
            </div>
          </div>

          <!-- Manga Torrent Sources -->
          <div class="manga-sources-card" data-manga-sources>
            <p class="muted">No sources loaded</p>
          </div>

          <div class="reader-footer">
            <button class="btn secondary" data-prev-chapter type="button">← Previous</button>
            <span class="chapter-info" data-chapter-info>Chapter Loading</span>
            <button class="btn secondary" data-next-chapter type="button">Next →</button>
          </div>
        </section>

        <!-- Chapters Sidebar -->
        <aside class="reader-sidebar">
          <div class="sidebar-head">
            <h3>Chapters</h3>
            <button class="icon-btn" data-chapters-search-toggle type="button" aria-label="Search chapters">🔍</button>
          </div>

          <div class="chapters-search" data-chapters-search>
            <input type="search" placeholder="Search chapters..." aria-label="Search chapters">
          </div>

          <div class="chapters-list" data-chapters-list>
            <div class="chapters-loading">
              <div class="spinner"></div>
              <p>Loading chapters...</p>
            </div>
          </div>
        </aside>
      </div>
    </main>

    <style>
      body[data-page="reader"] {
        background: linear-gradient(145deg, #000 0%, var(--bg-2) 54%, #000 100%);
      }

      .reader-container {
        display: grid;
        grid-template-columns: minmax(0, 2fr) 320px;
        gap: 24px;
        margin: 24px 0;
        align-items: start;
      }

      .reader-main {
        display: grid;
        gap: 16px;
      }

      .reader-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: color-mix(in srgb, var(--solid) 50%, transparent);
      }

      .reader-header h2 {
        margin: 0;
        font-size: 18px;
        flex: 1;
      }

      .reader-top-actions {
        display: flex;
        gap: 8px;
      }

      .chapter-display {
        display: grid;
        gap: 12px;
        min-height: 400px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #000;
        padding: 16px;
        overflow-y: auto;
      }

      .chapter-display::-webkit-scrollbar {
        width: 6px;
      }

      .chapter-display::-webkit-scrollbar-thumb {
        background: rgba(72, 219, 251, 0.3);
        border-radius: 3px;
      }

      .reader-loading {
        display: grid;
        gap: 16px;
        place-items: center;
        height: 100%;
        color: var(--muted);
      }

      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(72, 219, 251, 0.2);
        border-top-color: var(--blue);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .chapter-page-image {
        width: 100%;
        max-height: 600px;
        object-fit: contain;
        border-radius: 8px;
        background: #0a0a0a;
      }

      .manga-sources-card {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: color-mix(in srgb, var(--solid) 50%, transparent);
        padding: 16px;
      }

      .reader-footer {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 16px;
        align-items: center;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: color-mix(in srgb, var(--solid) 50%, transparent);
      }

      .chapter-info {
        text-align: center;
        color: var(--muted);
        font-size: 13px;
      }

      .reader-footer .btn {
        min-height: 38px;
      }

      .reader-sidebar {
        display: grid;
        gap: 12px;
        align-content: start;
        max-height: calc(100vh - 150px);
        position: sticky;
        top: 100px;
      }

      .sidebar-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 0 6px;
      }

      .sidebar-head h3 {
        margin: 0;
        font-size: 16px;
      }

      .chapters-search {
        display: none;
        padding: 0 6px;
      }

      .chapters-search.show {
        display: block;
      }

      .chapters-search input {
        width: 100%;
        min-height: 36px;
        border-radius: 10px;
        padding: 0 12px;
        border: 1px solid var(--line);
        background: color-mix(in srgb, var(--solid) 60%, transparent);
        color: var(--text);
        font-size: 13px;
      }

      .chapters-search input:focus {
        border-color: color-mix(in srgb, var(--blue) 70%, transparent);
        outline: none;
      }

      .chapters-list {
        display: grid;
        gap: 8px;
        overflow-y: auto;
        padding: 0 6px;
        max-height: 100%;
      }

      .chapters-list::-webkit-scrollbar {
        width: 6px;
      }

      .chapters-list::-webkit-scrollbar-thumb {
        background: rgba(72, 219, 251, 0.3);
        border-radius: 3px;
      }

      .chapters-loading {
        display: grid;
        gap: 12px;
        place-items: center;
        padding: 24px;
        color: var(--muted);
      }

      .chapter-item {
        display: grid;
        gap: 4px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: color-mix(in srgb, var(--soft) 50%, transparent);
        cursor: pointer;
        transition: all 150ms ease;
        text-align: left;
      }

      .chapter-item:hover {
        border-color: color-mix(in srgb, var(--blue) 50%, var(--line));
        background: color-mix(in srgb, var(--soft) 70%, transparent);
      }

      .chapter-item.active {
        border-color: var(--blue);
        background: linear-gradient(135deg, rgba(var(--theme-primary-rgb), 0.2), transparent);
        box-shadow: 0 0 12px rgba(var(--theme-primary-rgb), 0.2);
      }

      .chapter-item.read {
        opacity: 0.6;
      }

      .chapter-num {
        font-size: 12px;
        color: var(--blue);
        font-weight: 700;
      }

      .chapter-title {
        margin: 0;
        font-size: 12px;
        color: var(--text);
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .chapter-date {
        font-size: 10px;
        color: var(--muted);
      }

      @media (max-width: 1200px) {
        .reader-container {
          grid-template-columns: 1fr;
        }

        .reader-sidebar {
          max-height: 400px;
          position: static;
          top: auto;
        }
      }

      @media (max-width: 720px) {
        .reader-header {
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
        }

        .reader-header h2 {
          width: 100%;
        }

        .reader-footer {
          grid-template-columns: 1fr;
        }

        .chapter-display {
          min-height: 300px;
        }
      }
    </style>
  </body>
</html>

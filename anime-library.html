<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Your saved anime tracking library." />
    <title>AniTrack | Anime Library</title>
    <link rel="stylesheet" href="styles.css?v=site-fix-28" />
    <script src="app.js?v=site-fix-28" defer></script>
  </head>
  <body data-page="library" data-library-kind="anime">
    <header class="topbar shell anilist-topbar">
      <a class="brand anilist-brand" href="index.html" aria-label="AniTrack home"><span>AT</span><b>AniTrack</b></a>
      <nav class="nav anilist-nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="anime.html">Anime</a>
        <a href="manga.html">Manga / Manhwa</a>
        <a href="doujin.html" data-adult-nav hidden>Doujin</a>
        <a class="active" href="profile.html">Profile</a>
      </nav>
    </header>

    <main class="profile-page">
      <section class="profile-hero compact" data-profile-hero>
        <div class="profile-hero-inner shell">
          <img class="profile-avatar" data-profile-avatar src="" alt="Profile avatar" />
          <h1 data-profile-name>fluffy07</h1>
        </div>
      </section>

      <nav class="profile-tabs" aria-label="Profile navigation">
        <div class="shell profile-tabs-inner">
          <a href="profile.html">Overview</a>
          <a class="active" href="anime-library.html">Anime Library</a>
          <a href="manga-library.html">Manga Library</a>
          <a href="adult-library.html" data-adult-nav hidden>Adult Library</a>
          <a href="profile-favorites.html">Favorites</a>
          <a href="profile-stats.html">Stats</a>
          <a href="profile.html#social">Social</a>
          <a href="profile.html#reviews">Reviews</a>
        </div>
      </nav>

      <section class="shell profile-list-layout">
        <aside class="profile-list-sidebar">
          <label class="profile-library-search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.7 18.4a7.7 7.7 0 1 1 5.4-13.1 7.7 7.7 0 0 1 0 10.8l4.1 4.1-2 2-4.1-4.1a7.6 7.6 0 0 1-3.4.8Zm0-3a4.7 4.7 0 1 0 0-9.4 4.7 4.7 0 0 0 0 9.4Z"/></svg>
            <input data-library-search type="search" placeholder="Filter" autocomplete="off">
          </label>
          <div class="profile-sidebar-block">
            <span>Lists</span>
            <div data-library-filters>
              <button class="active" data-filter="all" type="button">All</button>
              <button data-filter="watching" type="button">Watching</button>
              <button data-filter="completed" type="button">Completed</button>
              <button data-filter="planning" type="button">Planning</button>
              <button data-filter="dropped" type="button">Dropped</button>
            </div>
          </div>
          <div class="profile-sidebar-block filters">
            <span>Filters</span>
            <label>Format<select data-library-advanced-filter="Format"><option value="all">Format</option></select></label>
            <label>Status<select data-library-advanced-filter="StatusText"><option value="all">Status</option></select></label>
            <label>Genres<select data-library-advanced-filter="Genre"><option value="all">Genres</option></select></label>
            <label>Year<select data-library-advanced-filter="Year"><option value="all">Year</option></select></label>
            <label>Sort<select data-library-advanced-filter="Sort"><option value="updated">Recently Updated</option><option value="title">Title</option><option value="score">Score</option><option value="progress">Progress</option><option value="year">Year</option></select></label>
          </div>
        </aside>
        <section class="profile-library-content">
          <div class="profile-list-tools" aria-label="Library view mode">
            <button data-library-view="compact" type="button" aria-label="Compact list view"><span></span></button>
            <button data-library-view="text" type="button" aria-label="Text list view"><span></span></button>
            <button data-library-view="grid" type="button" aria-label="Poster grid view"><span></span></button>
          </div>
          <div class="profile-library-head"><h2>Watching</h2><p class="muted" data-library-summary>0 anime saved locally</p></div>
          <div class="library-list profile-card-grid" data-library-list="anime" aria-live="polite"></div>
        </section>
      </section>
    </main>
  </body>
</html>

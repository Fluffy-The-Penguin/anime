<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Your saved anime tracking library." />
    <title>AniTrack | Anime List</title>
    <link rel="stylesheet" href="styles.css?v=profile-rework-1" />
    <script src="app.js?v=profile-rework-1" defer></script>
  </head>
  <body data-page="library" data-library-kind="anime">
    <header class="topbar shell anilist-topbar">
      <a class="brand anilist-brand" href="index.html" aria-label="AniTrack home"><span>A</span><i>L</i></a>
      <nav class="nav anilist-nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="profile.html">Profile</a>
        <a class="active" href="anime-library.html">Anime List</a>
        <a href="manga-library.html">Manga List</a>
        <a href="anime.html">Browse</a>
        <a href="settings.html">Forum</a>
      </nav>
    </header>

    <main class="profile-page">
      <section class="profile-hero compact" data-profile-hero>
        <div class="profile-hero-inner shell">
          <img class="profile-avatar" data-profile-avatar src="" alt="Profile avatar" />
          <h1 data-profile-name>fluffy07</h1>
        </div>
      </section>

      <nav class="profile-tabs" aria-label="Profile navigation">
        <div class="shell profile-tabs-inner">
          <a href="profile.html">Overview</a>
          <a class="active" href="anime-library.html">Anime List</a>
          <a href="manga-library.html">Manga List</a>
          <a href="profile.html#favorites">Favorites</a>
          <a href="profile.html#stats">Stats</a>
          <a href="profile.html#social">Social</a>
          <a href="profile.html#reviews">Reviews</a>
          <a href="profile.html#submissions">Submissions</a>
        </div>
      </nav>

      <section class="shell profile-list-layout">
        <aside class="profile-list-sidebar">
          <label class="profile-library-search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.7 18.4a7.7 7.7 0 1 1 5.4-13.1 7.7 7.7 0 0 1 0 10.8l4.1 4.1-2 2-4.1-4.1a7.6 7.6 0 0 1-3.4.8Zm0-3a4.7 4.7 0 1 0 0-9.4 4.7 4.7 0 0 0 0 9.4Z"/></svg>
            <input data-library-search type="search" placeholder="Filter" autocomplete="off">
          </label>
          <div class="profile-sidebar-block">
            <span>Lists</span>
            <div data-library-filters>
              <button class="active" data-filter="all" type="button">All</button>
              <button data-filter="watching" type="button">Watching</button>
              <button data-filter="completed" type="button">Completed</button>
              <button data-filter="planning" type="button">Planning</button>
              <button data-filter="dropped" type="button">Dropped</button>
            </div>
          </div>
          <div class="profile-sidebar-block filters">
            <span>Filters</span>
            <label>Adult filter<select data-library-adult-filter><option value="all">All titles</option><option value="adult">Adult only</option><option value="normal">Normal only</option></select></label>
            <label>Format<select><option>Format</option></select></label>
            <label>Status<select><option>Status</option></select></label>
            <label>Genres<select><option>Genres</option></select></label>
            <label>Country<select><option>Country</option></select></label>
          </div>
        </aside>
        <section class="profile-library-content">
          <div class="profile-list-tools" aria-hidden="true"><span></span><span></span><span class="active"></span></div>
          <div class="profile-library-head"><h2>Watching</h2><p class="muted" data-library-summary>0 anime saved locally</p></div>
          <div class="library-list profile-card-grid" data-library-list="anime" aria-live="polite"></div>
        </section>
      </section>
    </main>
  </body>
</html>

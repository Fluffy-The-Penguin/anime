<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Your AniTrack favorite titles and doujin artists." />
    <title>AniTrack | Favorites</title>
    <link rel="stylesheet" href="styles.css?v=site-fix-11" />
    <script src="app.js?v=site-fix-11" defer></script>
  </head>
  <body data-page="profile">
    <header class="topbar shell anilist-topbar">
      <a class="brand anilist-brand" href="index.html" aria-label="AniTrack home"><span>AT</span><b>AniTrack</b></a>
      <nav class="nav anilist-nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="anime.html">Anime</a>
        <a href="manga.html">Manga / Manhwa</a>
        <a href="doujin.html" data-adult-nav hidden>Doujin</a>
        <a class="active" href="profile.html">Profile</a>
      </nav>
    </header>

    <main class="profile-page">
      <section class="profile-hero compact" data-profile-hero>
        <div class="profile-hero-inner shell">
          <img class="profile-avatar" data-profile-avatar src="" alt="Profile avatar" />
          <h1 data-profile-name>fluffy07</h1>
        </div>
      </section>

      <nav class="profile-tabs" aria-label="Profile navigation">
        <div class="shell profile-tabs-inner">
          <a href="profile.html">Overview</a>
          <a href="anime-library.html">Anime Library</a>
          <a href="manga-library.html">Manga Library</a>
          <a href="adult-library.html" data-adult-nav hidden>Adult Library</a>
          <a class="active" href="profile-favorites.html">Favorites</a>
          <a href="profile-stats.html">Stats</a>
          <a href="profile.html#social">Social</a>
          <a href="profile.html#reviews">Reviews</a>
        </div>
      </nav>

      <section class="shell profile-subpage profile-favorites-shell">
        <header class="profile-subpage-hero">
          <span class="eyebrow">Pinned Library</span>
          <h2>Favorites</h2>
          <p>Filter favorite anime, manga, adult titles, and artist pins from one focused page.</p>
        </header>
        <article class="profile-panel profile-control-panel" id="favorites">
          <div class="profile-panel-head profile-filter-head"><h2>Favorites</h2><div class="profile-filter-tools"><input data-profile-favorite-search type="search" placeholder="Search favorites" aria-label="Search favorites"><select data-profile-favorite-filter aria-label="Filter favorites"><option value="all">All favorites</option><option value="anime">Anime</option><option value="manga">Manga / Manhwa</option><option value="doujin">Doujin</option><option value="hentai">Hentai</option><option value="pornhwa">Pornhwa</option><option value="artists">Artists</option></select><select data-profile-favorite-sort aria-label="Sort favorites"><option value="recent">Recently favorited</option><option value="title">Title A-Z</option><option value="type">Group by type</option></select></div></div>
          <div class="profile-favorites-list profile-favorites-page" data-profile-favorites></div>
        </article>
      </section>
    </main>
  </body>
</html>
